openapi: 3.1.0
info:
  title: PDF Document Chat API
  version: 1.0.0
  description: >
    Session-scoped API for uploading one PDF, checking its processing state, asking
    document-grounded questions, generating a summary, and releasing document text.
servers:
  - url: http://localhost:3001
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check API liveness
      responses:
        "200":
          description: API process is responsive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /api/documents:
    post:
      operationId: uploadDocument
      summary: Accept one PDF for asynchronous processing
      description: >
        Multipart upload. Enforce the 20 MB boundary before processing. A successful
        response means accepted for processing, not yet ready. The original file is not
        durably stored. Parser-discovered failures are reported by the status resource
        as `status: failed`; `422` is reserved for synchronous signature/preflight checks.
        Accept exactly one file part named `file` and no other fields.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: File accepted and processing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ProcessingCapacity"

  /api/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocumentStatus
      summary: Read document processing status
      responses:
        "200":
          description: Current processing state and safe metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDocument
      summary: Release volatile document data
      responses:
        "204":
          description: Document data removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/documents/{documentId}/messages:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      operationId: askDocumentQuestion
      summary: Generate a streaming answer from the active document
      description: >
        The browser owns complete chat history and sends only bounded recent context.
        No history is persisted by the API. Before streaming begins, failures use the
        standard JSON error response; after it begins, failures use an SSE error event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, history]
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 4000
                history:
                  type: array
                  maxItems: 20
                  items:
                    $ref: "#/components/schemas/HistoryMessage"
      responses:
        "200":
          description: Answer stream; event payloads are JSON encoded
          content:
            text/event-stream:
              schema:
                type: string
              x-sse-events:
                delta:
                  $ref: "#/components/schemas/StreamDelta"
                complete:
                  $ref: "#/components/schemas/StreamComplete"
                error:
                  $ref: "#/components/schemas/ApiError"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DocumentNotReady"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "502":
          $ref: "#/components/responses/ProviderFailure"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /api/documents/{documentId}/summaries:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      operationId: createDocumentSummary
      summary: Generate a streaming summary of the active document
      description: >
        No request body is required. Before streaming begins, failures use the standard
        JSON error response; after it begins, failures use an SSE error event.
      responses:
        "200":
          description: Summary stream; event payloads are JSON encoded
          content:
            text/event-stream:
              schema:
                type: string
              x-sse-events:
                delta:
                  $ref: "#/components/schemas/StreamDelta"
                complete:
                  $ref: "#/components/schemas/StreamComplete"
                error:
                  $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DocumentNotReady"
        "502":
          $ref: "#/components/responses/ProviderFailure"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

components:
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque, volatile identifier returned when the upload is accepted.
  schemas:
    DocumentStatus:
      type: object
      required: [documentId, displayName, status]
      properties:
        documentId:
          type: string
          format: uuid
        displayName:
          type: string
          description: Sanitized basename only; never a server path.
        status:
          type: string
          enum: [processing, ready, failed]
        pageCount:
          type: integer
          minimum: 1
          maximum: 200
        extractedCharacterCount:
          type: integer
          minimum: 1
          description: Length only; extracted text is never returned.
        error:
          $ref: "#/components/schemas/ApiError"
    HistoryMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
    StreamDelta:
      type: object
      required: [text]
      properties:
        text:
          type: string
    StreamComplete:
      type: object
      required: [messageId, createdAt]
      properties:
        messageId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    ApiError:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
  responses:
    BadRequest:
      description: Malformed request or invalid field
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request or uploaded PDF exceeds its configured limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Upload is not a PDF
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableContent:
      description: PDF signature or synchronous preflight validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Document is unknown, deleted, or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DocumentNotReady:
      description: Document is still processing or processing failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProviderFailure:
      description: Provider returned an invalid response or failed the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProviderUnavailable:
      description: Provider is unavailable or timed out
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error without internal details
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProcessingCapacity:
      description: Document store or bounded PDF processing queue is at capacity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
